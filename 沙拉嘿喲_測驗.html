<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沙拉嘿喲．戀愛實驗所</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f0e0c;--gold:#c9a96e;--gold2:#e8c98a;--cream:#f0e8d8;--blush:#d4907a;--sage:#8aab96;--mist:#a8b8c4;--txt:#ede5d4;--sub:#b8ad9e;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--ink);color:var(--txt);font-family:'Noto Serif TC',serif;min-height:100vh;overflow-x:hidden;}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.17;animation:drift 18s ease-in-out infinite alternate;}
.b1{width:600px;height:600px;background:#4a3820;top:-200px;left:-100px;}
.b2{width:400px;height:400px;background:#1e3040;top:30%;right:-100px;animation-delay:-5s;}
.b3{width:500px;height:300px;background:#2d1f14;bottom:0;left:20%;animation-delay:-10s;}
.b4{width:300px;height:500px;background:#1a2d20;top:50%;left:50%;animation-delay:-7s;}
@keyframes drift{from{transform:translate(0,0) scale(1);}to{transform:translate(40px,30px) scale(1.1);}}
.stars{position:fixed;inset:0;z-index:1;pointer-events:none;}
.star{position:absolute;border-radius:50%;background:var(--gold);animation:twinkle var(--d) ease-in-out infinite alternate;opacity:var(--o);}
@keyframes twinkle{from{opacity:var(--o);}to{opacity:calc(var(--o)*.12);}}
@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.audio-btn{position:fixed;top:18px;right:18px;z-index:300;width:40px;height:40px;border-radius:50%;border:1px solid rgba(201,169,110,.4);background:rgba(15,14,12,.85);color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:.3s;backdrop-filter:blur(10px);}
.audio-btn:hover{border-color:var(--gold);}
.wrap{position:relative;z-index:10;max-width:720px;margin:0 auto;padding:0 24px;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
.scr{width:100%;display:none;flex-direction:column;align-items:center;animation:fadeUp .7s ease forwards;}
.scr.on{display:flex;}
/* INTRO */
#si{min-height:100vh;justify-content:center;text-align:center;padding:60px 0;}
.site-name{font-family:'Noto Sans TC',sans-serif;font-size:11px;letter-spacing:7px;color:var(--gold);opacity:.6;margin-bottom:10px;}
.site-dot{color:var(--gold);opacity:.4;margin:0 4px;}
.intro-deco{font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:6px;color:var(--gold);opacity:.45;margin-bottom:34px;}
.intro-svg{width:170px;height:170px;margin:0 auto 32px;animation:floatY 6s ease-in-out infinite;}
.main-ttl{font-family:'Noto Serif TC',serif;font-size:clamp(26px,5.5vw,42px);font-weight:400;color:var(--cream);line-height:1.55;margin-bottom:16px;}
.main-sub{font-size:13px;color:var(--sub);line-height:2.1;letter-spacing:.8px;margin-bottom:14px;max-width:360px;}
.poem{font-family:'Noto Sans TC',sans-serif;font-size:13px;color:var(--gold);opacity:.68;letter-spacing:3px;margin-bottom:44px;line-height:2.4;}
/* REGISTER */
#sr{min-height:100vh;justify-content:center;text-align:center;padding:60px 0;}
.reg-deco{font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:6px;color:var(--gold);opacity:.55;margin-bottom:26px;}
.reg-ttl{font-family:'Noto Serif TC',serif;font-size:clamp(20px,4vw,30px);color:var(--cream);margin-bottom:10px;font-weight:400;}
.reg-sub{font-size:13px;color:var(--sub);margin-bottom:40px;line-height:2;letter-spacing:.5px;}
.inp-grp{width:100%;max-width:400px;margin-bottom:18px;text-align:left;}
.inp-lbl{font-size:10px;letter-spacing:4px;color:var(--gold);opacity:.78;display:block;margin-bottom:9px;font-family:'Noto Sans TC',sans-serif;}
.txt-inp{width:100%;padding:13px 16px;background:rgba(255,255,255,.03);border:1px solid rgba(201,169,110,.22);color:var(--txt);font-family:'Noto Serif TC',serif;font-size:15px;letter-spacing:.8px;outline:none;transition:.3s;}
.txt-inp::placeholder{color:var(--sub);opacity:.42;}
.txt-inp:focus{border-color:var(--gold);}
.gender-row{display:flex;gap:10px;width:100%;max-width:400px;margin-bottom:32px;}
.g-btn{flex:1;padding:13px 6px;background:rgba(255,255,255,.02);border:1px solid rgba(201,169,110,.18);color:var(--sub);font-family:'Noto Serif TC',serif;font-size:13px;letter-spacing:2px;cursor:pointer;transition:.3s;}
.g-btn.sel,.g-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,169,110,.05);}
.err{font-size:11px;color:var(--blush);min-height:16px;margin-bottom:14px;letter-spacing:.5px;}
.gold-btn{padding:14px 42px;background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:'Noto Serif TC',serif;font-size:14px;letter-spacing:4px;cursor:pointer;transition:.4s;position:relative;overflow:hidden;}
.gold-btn::before{content:'';position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:.4s;z-index:-1;}
.gold-btn:hover{color:var(--ink);}
.gold-btn:hover::before{transform:scaleX(1);}
/* QUIZ */
#sq{padding:60px 0 80px;}
.prog-wrap{width:100%;margin-bottom:42px;}
.prog-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);letter-spacing:2px;margin-bottom:9px;font-family:'Noto Sans TC',sans-serif;}
.prog-track{width:100%;height:1px;background:rgba(201,169,110,.15);}
.prog-fill{height:100%;background:var(--gold);transition:width .6s ease;position:relative;}
.prog-fill::after{content:'';position:absolute;right:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--gold);}
.q-deco{font-family:'Noto Sans TC',sans-serif;font-size:10px;color:var(--gold);opacity:.42;letter-spacing:5px;margin-bottom:20px;text-align:center;}
.q-illus{width:100px;height:100px;margin:0 auto 26px;}
.q-txt{font-family:'Noto Serif TC',serif;font-size:clamp(18px,3.5vw,25px);color:var(--cream);text-align:center;line-height:1.75;margin-bottom:9px;}
.q-sub{font-size:12px;color:var(--sub);text-align:center;letter-spacing:.4px;margin-bottom:36px;font-style:italic;line-height:1.9;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;}
.opt{padding:17px 15px;background:rgba(255,255,255,.02);border:1px solid rgba(201,169,110,.15);color:var(--txt);font-family:'Noto Serif TC',serif;font-size:13px;line-height:1.7;cursor:pointer;text-align:left;transition:.3s;position:relative;overflow:hidden;}
.opt::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,169,110,.07),transparent);opacity:0;transition:.3s;}
.opt:hover{border-color:var(--gold);color:var(--cream);}
.opt:hover::before{opacity:1;}
.opt-em{display:block;font-size:21px;margin-bottom:7px;}
/* RESULT */
#sres{padding:60px 0 80px;text-align:center;}
.res-deco{font-family:'Noto Sans TC',sans-serif;font-size:10px;color:var(--gold);letter-spacing:6px;opacity:.62;margin-bottom:26px;}
.res-illus{width:140px;height:140px;margin:0 auto 26px;animation:floatY 6s ease-in-out infinite;}
.res-lbl{font-size:10px;letter-spacing:5px;color:var(--sub);margin-bottom:12px;font-family:'Noto Sans TC',sans-serif;}
.res-ttl{font-family:'Noto Serif TC',serif;font-size:clamp(22px,4.5vw,36px);color:var(--cream);margin-bottom:7px;font-weight:400;line-height:1.45;}
.res-sub2{font-family:'Noto Sans TC',sans-serif;font-size:14px;color:var(--gold);letter-spacing:3px;margin-bottom:26px;opacity:.8;}
.res-desc{font-size:13px;color:var(--sub);line-height:2.3;margin-bottom:34px;max-width:520px;}
.divider{width:55px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:26px auto;}
.bks-ttl{font-size:10px;letter-spacing:5px;color:var(--gold);margin-bottom:16px;text-align:center;opacity:.72;font-family:'Noto Sans TC',sans-serif;}
.bk{padding:14px 17px;border:1px solid rgba(201,169,110,.13);margin-bottom:9px;background:rgba(255,255,255,.016);transition:.3s;text-align:left;}
.bk:hover{border-color:rgba(201,169,110,.32);}
.bk-tag{display:inline-block;font-size:9px;letter-spacing:3px;color:var(--gold);border:1px solid rgba(201,169,110,.36);padding:1px 8px;margin-bottom:7px;font-family:'Noto Sans TC',sans-serif;}
.bk-name{font-family:'Noto Serif TC',serif;font-size:16px;color:var(--cream);margin-bottom:4px;}
.bk-note{font-size:11px;color:var(--sub);line-height:1.8;}
.ch-mark{display:flex;align-items:center;gap:12px;width:100%;margin:32px 0 24px;color:var(--gold);opacity:.38;font-size:10px;letter-spacing:4px;font-family:'Noto Sans TC',sans-serif;}
.ch-mark::before,.ch-mark::after{content:'';flex:1;height:1px;background:currentColor;opacity:.4;}
.tip-box{width:100%;border:1px solid rgba(201,169,110,.18);padding:20px 24px;margin-top:26px;background:rgba(201,169,110,.03);position:relative;text-align:left;}
.tip-box::before{content:'\275D';position:absolute;top:-12px;left:16px;background:var(--ink);color:var(--gold);font-size:18px;padding:0 7px;}
.tip-txt{font-size:12px;color:var(--sub);line-height:2.2;}
.tip-txt strong{color:var(--gold);font-weight:400;}
.retry-btn{margin-top:42px;padding:12px 36px;background:transparent;border:1px solid rgba(201,169,110,.3);color:var(--sub);font-family:'Noto Serif TC',serif;font-size:12px;letter-spacing:3px;cursor:pointer;transition:.3s;}
.retry-btn:hover{border-color:var(--gold);color:var(--gold);}
/* COUPON */
.cpn-ov{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;}
.cpn-box{max-width:390px;width:100%;background:linear-gradient(145deg,#1c1912,#0f0e0c);border:1px solid var(--gold);position:relative;padding:46px 30px 30px;box-shadow:0 0 60px rgba(201,169,110,.18),inset 0 0 50px rgba(201,169,110,.025);animation:cpnPop .55s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes cpnPop{from{opacity:0;transform:scale(.82) translateY(18px);}to{opacity:1;transform:scale(1) translateY(0);}}
.cpn-spark{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--ink);padding:0 14px;font-size:20px;letter-spacing:3px;}
.cpn-c{position:absolute;width:14px;height:14px;border-color:var(--gold2);border-style:solid;opacity:.42;}
.cpn-c.tl{top:7px;left:7px;border-width:1px 0 0 1px;}.cpn-c.tr{top:7px;right:7px;border-width:1px 1px 0 0;}
.cpn-c.bl{bottom:7px;left:7px;border-width:0 0 1px 1px;}.cpn-c.br{bottom:7px;right:7px;border-width:0 1px 1px 0;}
.cpn-lbl{font-family:'Noto Sans TC',sans-serif;font-size:9px;letter-spacing:6px;color:var(--gold);opacity:.62;text-align:center;margin-bottom:10px;}
.cpn-title{font-family:'Noto Serif TC',serif;font-size:18px;color:var(--cream);text-align:center;margin-bottom:4px;font-weight:400;}
.cpn-amt{font-family:'Noto Serif TC',serif;font-size:58px;color:var(--gold);text-align:center;font-weight:300;line-height:1;margin-bottom:2px;}
.cpn-unit{font-size:11px;color:var(--sub);text-align:center;letter-spacing:3px;margin-bottom:16px;font-family:'Noto Sans TC',sans-serif;}
.cpn-hr{border:none;border-top:1px dashed rgba(201,169,110,.26);margin:14px 0;}
.cpn-code-lbl{font-family:'Noto Sans TC',sans-serif;font-size:9px;letter-spacing:4px;color:var(--sub);text-align:center;margin-bottom:5px;}
.cpn-code-val{font-family:'Noto Serif TC',serif;font-size:19px;color:var(--gold2);text-align:center;letter-spacing:5px;margin-bottom:12px;}
.cpn-for{font-size:12px;color:var(--sub);text-align:center;margin-bottom:4px;}
.cpn-note{font-size:10px;color:rgba(184,173,158,.42);text-align:center;line-height:1.8;margin-bottom:16px;}
.cpn-shot{font-family:'Noto Sans TC',sans-serif;font-size:10px;color:var(--blush);text-align:center;letter-spacing:1px;margin-bottom:18px;}
.cpn-close{width:100%;padding:12px;background:transparent;border:1px solid rgba(201,169,110,.3);color:var(--sub);font-family:'Noto Serif TC',serif;font-size:12px;letter-spacing:3px;cursor:pointer;transition:.3s;}
.cpn-close:hover{border-color:var(--gold);color:var(--gold);}
/* footer */
.footer{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-family:'Noto Sans TC',sans-serif;font-size:9px;letter-spacing:3px;color:rgba(201,169,110,.22);white-space:nowrap;z-index:5;}
@media(max-width:480px){.opts{grid-template-columns:1fr;}.wrap{padding:0 14px;}.cpn-box{padding:42px 18px 26px;}}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>
<div class="stars" id="stars"></div>
<button class="audio-btn" id="abtn" onclick="toggleAudio()">&#127925;</button>
<div class="footer">沙拉嘿喲 &middot; 戀愛實驗所</div>
<audio id="bgm" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3" type="audio/mpeg"></audio>

<!-- Coupon -->
<div class="cpn-ov" id="cpnOv" style="display:none;">
  <div class="cpn-box">
    <div class="cpn-spark">&#10024;&#127873;&#10024;</div>
    <div class="cpn-c tl"></div><div class="cpn-c tr"></div><div class="cpn-c bl"></div><div class="cpn-c br"></div>
    <div class="cpn-lbl">&#10022;&nbsp;&nbsp;隱藏獎勵&nbsp;&nbsp;&#10022;</div>
    <div class="cpn-title">恭喜你抽到了</div>
    <div class="cpn-amt">$50</div>
    <div class="cpn-unit">情感本折價券</div>
    <hr class="cpn-hr">
    <div class="cpn-code-lbl">專屬序號</div>
    <div class="cpn-code-val" id="cpnCode">—</div>
    <div class="cpn-for" id="cpnFor">—</div>
    <div class="cpn-note">憑此截圖，約本享折抵 $50 優惠<br>每人限用一次，不可轉讓</div>
    <div class="cpn-shot">&#128247; 請截圖保存此畫面</div>
    <button class="cpn-close" onclick="closeCpn()">我已截圖，繼續查看結果</button>
  </div>
</div>

<div class="wrap">
<!-- INTRO -->
<div class="scr on" id="si">
  <div class="site-name">沙拉嘿喲<span class="site-dot">．</span>戀愛實驗所</div>
  <div class="intro-deco">&#10022;&nbsp;&nbsp;情感本測驗&nbsp;&nbsp;&#10022;</div>
  <div class="intro-svg">
    <svg viewBox="0 0 200 200" fill="none">
      <circle cx="100" cy="100" r="70" stroke="#c9a96e" stroke-width=".5" stroke-dasharray="4 6" opacity=".26"/>
      <path d="M100 30C60 30,35 60,35 100C35 140,60 170,100 170C80 155,68 130,68 100C68 70,80 45,100 30Z" fill="#c9a96e" opacity=".11" stroke="#c9a96e" stroke-width=".8" stroke-opacity=".42"/>
      <rect x="72" y="85" width="56" height="42" rx="2" stroke="#e8c98a" stroke-width=".8" fill="none" opacity=".52"/>
      <line x1="100" y1="85" x2="100" y2="127" stroke="#e8c98a" stroke-width=".8" opacity=".52"/>
      <line x1="80" y1="97" x2="96" y2="97" stroke="#e8c98a" stroke-width=".5" opacity=".35"/>
      <line x1="80" y1="104" x2="96" y2="104" stroke="#e8c98a" stroke-width=".5" opacity=".35"/>
      <line x1="80" y1="111" x2="96" y2="111" stroke="#e8c98a" stroke-width=".5" opacity=".35"/>
      <line x1="104" y1="97" x2="120" y2="97" stroke="#e8c98a" stroke-width=".5" opacity=".35"/>
      <line x1="104" y1="104" x2="120" y2="104" stroke="#e8c98a" stroke-width=".5" opacity=".35"/>
      <line x1="104" y1="111" x2="120" y2="111" stroke="#e8c98a" stroke-width=".5" opacity=".35"/>
      <circle cx="60" cy="65" r="1.5" fill="#c9a96e" opacity=".42"/>
      <circle cx="148" cy="72" r="1" fill="#c9a96e" opacity=".35"/>
      <circle cx="52" cy="135" r="1.5" fill="#c9a96e" opacity=".28"/>
    </svg>
  </div>
  <h1 class="main-ttl">你是哪一種<br>情感的人</h1>
  <p class="main-sub">每個人心裡都藏著不同的溫度<br>有人渴望在校園的走廊尋回舊夢<br>有人只想在咖啡館的角落安靜哭一場</p>
  <div class="poem">此刻你的心<br>像哪一種天氣</div>
  <button class="gold-btn" onclick="goReg()">開始測驗</button>
</div>

<!-- REGISTER -->
<div class="scr" id="sr">
  <div class="reg-deco">&#10022;&nbsp;&nbsp;讓沙拉更認識你&nbsp;&nbsp;&#10022;</div>
  <h2 class="reg-ttl">先告訴我你是誰</h2>
  <p class="reg-sub">這樣結果會更貼近你</p>
  <div class="inp-grp">
    <label class="inp-lbl">你的暱稱</label>
    <input class="txt-inp" type="text" id="nick" placeholder="輸入你的暱稱" maxlength="20" autocomplete="off">
  </div>
  <div class="inp-grp" style="margin-bottom:10px;">
    <label class="inp-lbl">你的性別</label>
  </div>
  <div class="gender-row">
    <button class="g-btn" id="gf" onclick="pickG('女生')">女生</button>
    <button class="g-btn" id="gm" onclick="pickG('男生')">男生</button>
    <button class="g-btn" id="gn" onclick="pickG('不設限')">不設限</button>
  </div>
  <div class="err" id="regErr"></div>
  <button class="gold-btn" onclick="submitReg()">進入測驗</button>
</div>

<!-- QUIZ -->
<div class="scr" id="sq">
  <div class="prog-wrap">
    <div class="prog-lbl"><span id="pTxt">第 1 題</span><span id="pFrac">1 / 7</span></div>
    <div class="prog-track"><div class="prog-fill" id="pFill" style="width:14%"></div></div>
  </div>
  <div class="q-deco" id="qDeco"></div>
  <div class="q-illus" id="qIllus"></div>
  <h2 class="q-txt" id="qTxt"></h2>
  <p class="q-sub" id="qSub"></p>
  <div class="opts" id="opts"></div>
</div>

<!-- RESULT -->
<div class="scr" id="sres">
  <div class="res-deco">&#10022; 測驗完成 &#10022;</div>
  <div class="res-illus" id="resIllus"></div>
  <div class="res-lbl">你的情感本類型</div>
  <h2 class="res-ttl" id="resTtl"></h2>
  <div class="res-sub2" id="resSub"></div>
  <p class="res-desc" id="resDesc"></p>
  <div class="divider"></div>
  <div class="ch-mark">為你推薦的本</div>
  <div id="bks"></div>
  <div class="tip-box" id="tipBox"></div>
  <button class="retry-btn" onclick="reset()">再測一次</button>
</div>
</div>

<script>
(function(){
  var s=document.getElementById('stars');
  for(var i=0;i<55;i++){
    var el=document.createElement('div');el.className='star';
    var sz=Math.random()>.75?2:1;
    el.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;--d:'+(3+Math.random()*6)+'s;--o:'+(0.08+Math.random()*0.38)+';width:'+sz+'px;height:'+sz+'px;animation-delay:'+(Math.random()*8)+'s';
    s.appendChild(el);
  }
})();
var _aud=false;
function toggleAudio(){
  var a=document.getElementById('bgm'),b=document.getElementById('abtn');
  if(_aud){a.pause();b.innerHTML='&#128263;';_aud=false;}
  else{a.play().catch(function(){});b.innerHTML='&#127925;';_aud=true;}
}
// ── Google Form submission ──
var _FORM_ID='1FAIpQLSf7jQugILbWb5rczkOx2veLZP4zM-kVTa6cAi4DnKV-wz2omw';
var _FORM_URL='https://docs.google.com/forms/d/e/'+_FORM_ID+'/formResponse';
function _sr2(r){
  var fd=new FormData();
  fd.append('entry.995088896', r.nickname||'');
  fd.append('entry.113909690', r.gender||'');
  fd.append('entry.318947473', r.resultType||'');
  fd.append('entry.1309127573', r.coupon||'（無）');
  fd.append('entry.780400167', r.ts||'');
  // Use no-cors fetch — Google Form doesn't need a response
  fetch(_FORM_URL,{method:'POST',mode:'no-cors',body:fd}).catch(function(){});
}
var cQ=0,scr={},uN='',uG='';
function showScr(id){
  document.querySelectorAll('.scr').forEach(function(s){s.classList.remove('on');});
  document.getElementById(id).classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
}
function goReg(){showScr('sr');}
function pickG(g){

function startQ(){
  cQ=0;scr={warm:0,drama:0,deep:0,cozy:0,campus:0,solo:0,art:0};

function renderQ(){
  var q=Qs[cQ];
  document.getElementById('pTxt').textContent='第 '+(cQ+1)+' 題';
  document.getElementById('pFrac').textContent=(cQ+1)+' / '+Qs.length;
  document.getElementById('pFill').style.width=(((cQ+1)/Qs.length)*100)+'%';
  document.getElementById('qDeco').innerHTML=q.d;
  document.getElementById('qTxt').textContent=q.t;
  document.getElementById('qSub').textContent=q.s;
  var ilt=['moon','book','flower','star'];
  document.getElementById('qIllus').innerHTML=SVG[ilt[cQ%4]];
  var g=document.getElementById('opts');g.innerHTML='';
  q.o.forEach(function(op){
    var b=document.createElement('button');b.className='opt';
    b.innerHTML='<span class="opt-em">'+op.e+'</span>'+op.t;
    b.onclick=(function(v){return function(){pick(v);};})(op.v);
    g.appendChild(b);
  });
}
function pick(v){
  Object.keys(v).forEach(function(k){scr[k]=(scr[k]||0)+v[k];});
  cQ++;if(cQ>=Qs.length)showRes();else renderQ();
}
function genCode(){
  var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='SALAD-';
  for(var i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];s+='-';
  for(var i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];
  return s;
}
function showCpn(code,nick,gender){
  document.getElementById('cpnCode').textContent=code;
  document.getElementById('cpnFor').textContent=nick+'（'+gender+'）專屬';
  document.getElementById('cpnOv').style.display='flex';
}
function closeCpn(){document.getElementById('cpnOv').style.display='none';}
function showRes(){
  var sorted=Object.entries(scr).sort(function(a,b){return b[1]-a[1];});
  var top=sorted[0][0],r=RES[top];
  document.getElementById('resTtl').textContent=r.title;
  document.getElementById('resSub').textContent=r.sub;
  document.getElementById('resDesc').textContent=r.desc;
  document.getElementById('resIllus').innerHTML=RILLUS[r.il]||RILLUS.warm;
  var bEl=document.getElementById('bks');
  bEl.innerHTML='<div class="bks-ttl">&#10022;&nbsp;&nbsp;為你點燈的本&nbsp;&nbsp;&#10022;</div>';
  r.books.forEach(function(b){
    bEl.innerHTML+='<div class="bk"><div class="bk-tag">'+b.tag+'</div><div class="bk-name">&#12298;'+b.name+'&#12299;</div><div class="bk-note">'+b.note+'</div></div>';
  });
  document.getElementById('tipBox').innerHTML='<p class="tip-txt">'+r.tip+'</p>';
  var hasCpn=Math.random()<0.30;
  var code=hasCpn?genCode():null;
  _sr2({id:Date.now(),nickname:uN,gender:uG,resultType:r.title,resultKey:top,coupon:code,ts:new Date().toISOString()});
  showScr('sres');
  if(hasCpn)setTimeout(function(){showCpn(code,uN,uG);},1100);
}
function reset(){
  uN='';uG='';
  document.getElementById('nick').value='';
  document.querySelectorAll('.g-btn').forEach(function(b){b.classList.remove('sel');});
  document.getElementById('regErr').textContent='';
  showScr('si');
}
</script>
